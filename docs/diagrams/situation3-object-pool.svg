<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820">
  <rect width="1180" height="820" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">!8BC0FVO 3. 1<565=5 =075<=5 >1;04=0==O</text>

  <defs>
    <marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#222" stroke-width="1"/>
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="10" refX="14" refY="5" orient="auto">
      <path d="M0,5 L7,0 L14,5 L7,10 Z" fill="#222"/>
    </marker>
  </defs>

  <!-- Program -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="40" y="60" width="250" height="128" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="165" y="80" text-anchor="middle" font-style="italic" font-size="13">&lt;&lt;Client&gt;&gt;</text>
    <text x="165" y="100" text-anchor="middle" font-weight="bold">Program</text>
    <line x1="40" y1="110" x2="290" y2="110" stroke="#222"/>
    <line x1="40" y1="118" x2="290" y2="118" stroke="#222"/>
    <text x="52" y="142"><tspan text-decoration="underline">+ Main() : void</tspan></text>
    <text x="52" y="166"><tspan text-decoration="underline">- Situation3() : void</tspan></text>
  </g>

  <!-- Flight -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="860" y="60" width="280" height="128" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1000" y="80" text-anchor="middle" font-style="italic" font-size="13">&lt;&lt;Client&gt;&gt;</text>
    <text x="1000" y="100" text-anchor="middle" font-weight="bold">Flight</text>
    <line x1="860" y1="110" x2="1140" y2="110" stroke="#222"/>
    <text x="872" y="134">+ Number : string</text>
    <line x1="860" y1="146" x2="1140" y2="146" stroke="#222"/>
    <text x="872" y="170">+ Flight(number : string)</text>
  </g>

  <!-- Pool -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="390" y="250" width="400" height="230" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="590" y="272" text-anchor="middle" font-style="italic" font-size="13">&lt;&lt;ObjectPool&gt;&gt;</text>
    <text x="590" y="294" text-anchor="middle" font-weight="bold">GroundEquipmentPool</text>
    <line x1="390" y1="306" x2="790" y2="306" stroke="#222"/>
    <text x="402" y="328">- units : List&lt;GroundUnit&gt;</text>
    <text x="402" y="350">- capacity : int</text>
    <text x="402" y="372">- journal : Journal</text>
    <line x1="390" y1="384" x2="790" y2="384" stroke="#222"/>
    <text x="402" y="408">+ GroundEquipmentPool(capacity, journal)</text>
    <text x="402" y="432">+ Acquire(flight : Flight) : GroundUnit</text>
    <text x="402" y="456">+ Release(unit, flight) : void</text>
  </g>

  <!-- GroundUnit -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="40" y="560" width="340" height="210" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="210" y="582" text-anchor="middle" font-style="italic" font-size="13">&lt;&lt;Reusable&gt;&gt;</text>
    <text x="210" y="604" text-anchor="middle" font-weight="bold">GroundUnit</text>
    <line x1="40" y1="616" x2="380" y2="616" stroke="#222"/>
    <text x="52" y="640">+ Id : string</text>
    <text x="52" y="662">+ IsFree : bool</text>
    <text x="52" y="684">+ AssignedTo : string</text>
    <line x1="40" y1="696" x2="380" y2="696" stroke="#222"/>
    <text x="52" y="720">+ GroundUnit(id : string)</text>
    <text x="52" y="742">+ Assign(flightNumber : string) : void</text>
    <text x="52" y="764">+ Release() : void</text>
  </g>

  <!-- Journal -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="800" y="580" width="340" height="150" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="970" y="604" text-anchor="middle" font-weight="bold">Journal</text>
    <line x1="800" y1="616" x2="1140" y2="616" stroke="#222"/>
    <text x="812" y="640">- minutes : int</text>
    <line x1="800" y1="652" x2="1140" y2="652" stroke="#222"/>
    <text x="812" y="676">+ Journal(startHour, startMinute)</text>
    <text x="812" y="700">+ Write(source, message) : void</text>
  </g>

  <!-- composition Pool to GroundUnit: diamond at pool -->
  <line x1="470" y1="480" x2="250" y2="560" stroke="#222" stroke-width="1.4" marker-start="url(#diamond)"/>
  <text x="300" y="530" font-family="Arial" font-size="13">1          715@V30T          0..*</text>

  <!-- association Pool to Journal -->
  <line x1="790" y1="420" x2="900" y2="580" stroke="#222" stroke-width="1.4" marker-end="url(#open)"/>
  <text x="800" y="500" font-family="Arial" font-size="13">1     2545 6C@=0;     1</text>

  <!-- dependency Pool to Flight -->
  <line x1="700" y1="250" x2="980" y2="188" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="760" y="210" font-family="Arial" font-size="13">28:>@8AB>2CT</text>

  <!-- Program dependencies -->
  <line x1="290" y1="140" x2="390" y2="300" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="300" y="200" font-family="Arial" font-size="13">AB2>@NT</text>
  <line x1="250" y1="188" x2="210" y2="560" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <line x1="200" y1="188" x2="860" y2="640" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
</svg>
